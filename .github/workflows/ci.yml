name: Untrusted CI

permissions:
  contents: read

on:
  push:
    branches:
      - feature/csoloader-hardening
      - optimize/hiding-memory-concurrency
      - rust/resource-lifecycle-hardening
      - port/treat-wheel-high-value
      - fix/p6-elf-load-segment-enumeration
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Verify pinned submodules
        run: |
          git submodule status --recursive
          if git submodule status --recursive | grep -Eq '^[+-U]'; then
            echo "A submodule is uninitialized, modified, or conflicted" >&2
            exit 1
          fi
          test -f loader/src/external/csoloader/include/csoloader.h

      - name: Setup NDK_PATH
        run: echo "NDK_PATH=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Setup Rust target
        run: rustup target add aarch64-linux-android

      - name: Test mountinfo parser
        run: make -C loader test-mountinfo

      - name: Test ELF parser with ASan and UBSan
        run: make -C loader test-elf-asan

      - name: Build
        run: |
          make all -j$(nproc)

      - name: Upload release
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          path: "build/out/ReZygisk-v*-release.zip"
          archive: false

      - name: Upload debug
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          path: "build/out/ReZygisk-v*-debug.zip"
          archive: false
