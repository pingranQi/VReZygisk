name: Untrusted CI

on:
  push:
    branches:
      - feature/csoloader-hardening
      - optimize/hiding-memory-concurrency
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Verify pinned submodules
        run: |
          git submodule status --recursive
          if git submodule status --recursive | grep -Eq '^[+-U]'; then
            echo "A submodule is uninitialized, modified, or conflicted" >&2
            exit 1
          fi
          test -f loader/src/external/csoloader/include/csoloader.h

      - name: Setup NDK_PATH
        run: echo "NDK_PATH=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Build
        run: |
          make all -j$(nproc)

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          path: "build/out/ReZygisk-v*-release.zip"
          archive: false

      - name: Upload debug
        uses: actions/upload-artifact@v7
        with:
          path: "build/out/ReZygisk-v*-debug.zip"
          archive: false
